services:
  php8:
    build: .
    volumes:
      - ./:/var/www:cached
    working_dir: /var/www

## Composer is baked into the image now. Inside the container just run e.g.:
##   docker compose run --rm php8 composer install
##   docker compose run --rm php8 vendor/bin/phpunit

## self hosted docker version
## docker run --rm -it -v $PWD:/var/www -w /var/www/examples/AuthorizationCode/ -p 7000:80 php php -S 0.0.0.0:80
## and in browser go to: http://localhost/InteractiveAuthorizationProcess:7000
